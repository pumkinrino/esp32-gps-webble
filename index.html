<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>WebBLE GPS</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px 20px; background: #121212; color: #fff; }
        button { padding: 15px 30px; font-size: 18px; border-radius: 8px; background: #007bff; color: white; border: none; font-weight: bold; }
        button:active { background: #0056b3; }
        #status { margin-top: 20px; color: #ffcc00; }
        #gpsData { margin-top: 10px; font-size: 20px; color: #00ffcc; }
    </style>
</head>
<body>
    <h2>Phát GPS cho ESP32</h2>
    <button id="connectBtn">Kết nối ESP32</button>
    <p id="status">Trạng thái: Chưa kết nối</p>
    <p id="gpsData">Tọa độ: Đang chờ...</p>

    <script>
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHAR_UUID_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
        let bleCharacteristic = null;
        let watchId = null;

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                document.getElementById('status').innerText = "Trạng thái: Đang quét BLE...";
                
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHAR_UUID_RX);

                document.getElementById('status').innerText = "Trạng thái: Đã kết nối!";
                
                if (navigator.geolocation) {
                    watchId = navigator.geolocation.watchPosition(
                        position => {
                            const lat = position.coords.latitude.toFixed(5);
                            const lon = position.coords.longitude.toFixed(5);
                            const dataStr = `${lat},${lon}`;
                            
                            document.getElementById('gpsData').innerText = `Tọa độ: ${dataStr}`;
                            
                            if (bleCharacteristic) {
                                let encoder = new TextEncoder();
                                bleCharacteristic.writeValue(encoder.encode(dataStr));
                            }
                        },
                        error => {
                            document.getElementById('status').innerText = "Lỗi GPS: " + error.message;
                        },
                        { enableHighAccuracy: true, maximumAge: 0 }
                    );
                } else {
                    document.getElementById('status').innerText = "Lỗi: Trình duyệt không hỗ trợ GPS";
                }
            } catch (error) {
                document.getElementById('status').innerText = "Lỗi: " + error;
            }
        });
    </script>
</body>
</html>
